services:
  postgres:
    image: postgres:16-alpine
    container_name: merchant-risk-postgres
    restart: unless-stopped
    env_file:
      - .env.postgres
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - merchant-network

  redis:
    image: redis:7-alpine
    container_name: merchant-risk-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - merchant-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merchant-risk-migrate
    restart: 'no'
    env_file:
      - .env.docker
    command: ['npm', 'run', 'migration-docker:run']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - merchant-network

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merchant-risk-seed
    restart: 'no'
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    command: ['npm', 'run', 'seed:users']
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - merchant-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merchant-risk-api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3000:3000'
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - merchant-network

volumes:
  postgres_data:
  redis_data:

networks:
  merchant-network:
    driver: bridge
